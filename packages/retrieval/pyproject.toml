[project]
name = "enterprise-rag-retrieval"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "enterprise-rag-domain",
    "enterprise-rag-db",
    "httpx>=0.28.0",
    "redis>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]
