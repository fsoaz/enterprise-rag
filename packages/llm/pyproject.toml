[project]
name = "enterprise-rag-llm"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "enterprise-rag-domain",
    "anthropic>=0.45.0",
    "pydantic>=2.10.0",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]
