[project]
name = "enterprise-rag-evaluation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "enterprise-rag-db",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]
