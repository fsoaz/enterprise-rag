[project]
name = "enterprise-rag-db"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "enterprise-rag-domain",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db"]
