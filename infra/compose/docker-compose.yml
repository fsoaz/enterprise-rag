# Every published port binds to ${BIND_ADDR}, which defaults to loopback.
# These services run with development credentials (default Postgres/MinIO/Keycloak
# passwords, no Redis auth). Exposing them on 0.0.0.0 hands any host on the
# network full read/write access to every tenant. Override BIND_ADDR only for
# an isolated network you control.
name: enterprise-rag

services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PUBLISH_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_PUBLISH_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MINIO_API_PUBLISH_PORT:-19000}:9000"
      - "${BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PUBLISH_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/enterprise-rag;
      exit 0;
      "
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8080
    volumes:
      - ./keycloak/enterprise-rag-realm.json:/opt/keycloak/data/import/enterprise-rag-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.api
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://rag_app:rag_app@postgres:5432/enterprise_rag
      DATABASE_URL_MIGRATE: postgresql+asyncpg://rag_migrate:rag_migrate@postgres:5432/enterprise_rag
      DATABASE_URL_MAINT: postgresql+asyncpg://rag_maint:rag_maint@postgres:5432/enterprise_rag
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      INFERENCE_BASE_URL: http://inference:8001
      INFERENCE_SERVICE_TOKEN: dev-inference-token
      OIDC_ISSUER: http://localhost:8080/realms/enterprise-rag
      OIDC_JWKS_URL: http://keycloak:8080/realms/enterprise-rag/protocol/openid-connect/certs
      # Hardcoded off: root .env must not silently enable impersonation via
      # --env-file / env_file. Use local uvicorn + apps/web/.env.local for bypass.
      DEV_AUTH_BYPASS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference:
        condition: service_healthy
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.api
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://rag_app:rag_app@postgres:5432/enterprise_rag
      DATABASE_URL_MIGRATE: postgresql+asyncpg://rag_migrate:rag_migrate@postgres:5432/enterprise_rag
      DATABASE_URL_MAINT: postgresql+asyncpg://rag_maint:rag_maint@postgres:5432/enterprise_rag
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      INFERENCE_BASE_URL: http://inference:8001
      INFERENCE_SERVICE_TOKEN: dev-inference-token
      DEV_AUTH_BYPASS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference:
        condition: service_healthy
    command: ["celery", "-A", "worker.celery_app.celery_app", "worker", "--loglevel=INFO"]

  inference:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.inference
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8001:8001"
    environment:
      LOG_LEVEL: INFO
      INFERENCE_SERVICE_TOKEN: dev-inference-token
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-bge}
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-cpu}
      HF_HOME: /models/huggingface
    volumes:
      - inference_models:/models
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10m

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.web
      # NEXT_PUBLIC_* is inlined into the client bundle at build time, so it has to
      # arrive as a build arg. Passing it under `environment:` sets it only in the
      # running container, where the already-compiled bundle never reads it.
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
        NEXT_PUBLIC_DEV_AUTH: "false"
    environment:
      API_BASE_URL: http://api:8000
      APP_BASE_URL: http://localhost:3000
      OIDC_ISSUER: http://localhost:8080/realms/enterprise-rag
      OIDC_INTERNAL_BASE_URL: http://keycloak:8080
      OIDC_CLIENT_ID: enterprise-rag-web
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  inference_models:
