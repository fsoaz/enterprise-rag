name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python deps
        run: uv sync --all-packages --group dev

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Biome check
        working-directory: apps/web
        run: npx biome check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python deps
        run: uv sync --all-packages --group dev

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: mypy
        run: uv run mypy

      - name: import-linter
        run: uv run lint-imports

      - name: TypeScript
        working-directory: apps/web
        run: npx tsc --noEmit

      # The committed OpenAPI document is a contract clients are written against.
      # Three endpoints were added in one round and it went stale unnoticed, so the
      # check regenerates from the code and fails on any difference.
      - name: OpenAPI in sync
        run: make openapi-check

      - name: Generated frontend API types in sync
        working-directory: apps/web
        run: |
          npm run generate:api-types
          git diff --exit-code -- src/lib/generated/api.ts

      # tsc alone does not catch build-time failures (RSC boundary violations,
      # static generation errors, font fetching), so the production build runs too.
      - name: Next build
        working-directory: apps/web
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: uv sync --all-packages --group dev

      - name: Pytest (unit)
        run: uv run pytest -q -m "not integration"
        env:
          DEV_AUTH_BYPASS: "true"

  web-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Vitest with coverage
        working-directory: apps/web
        run: npm run test:coverage

  integration-db:
    name: Migrations + RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enterprise_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enterprise_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # /ready reports per-dependency status, so the readiness integration test
      # needs Redis reachable as well as Postgres.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rag_app:rag_app@localhost:5432/enterprise_rag_test
      TEST_DATABASE_URL_MIGRATE: postgresql+psycopg://rag_migrate:rag_migrate@localhost:5432/enterprise_rag_test
      DATABASE_URL: postgresql+asyncpg://rag_app:rag_app@localhost:5432/enterprise_rag_test
      DATABASE_URL_SYNC: postgresql+psycopg://rag_app:rag_app@localhost:5432/enterprise_rag_test
      DATABASE_URL_MIGRATE: postgresql+psycopg://rag_migrate:rag_migrate@localhost:5432/enterprise_rag_test
      DATABASE_URL_MAINT: postgresql+asyncpg://rag_maint:rag_maint@localhost:5432/enterprise_rag_test
      REDIS_URL: redis://localhost:6379/0
      INFERENCE_BASE_URL: http://localhost:8001
      INFERENCE_SERVICE_TOKEN: ci-inference-token
      INFERENCE_BACKEND: stub
      DEV_AUTH_BYPASS: "true"
      OIDC_ISSUER: http://localhost:8080/realms/enterprise-rag
      OIDC_AUDIENCE: enterprise-rag-api
      OIDC_JWKS_URL: http://localhost:8080/realms/enterprise-rag/protocol/openid-connect/certs
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: uv sync --all-packages --group dev

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Init roles and extensions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d enterprise_rag_test \
            -f infra/compose/postgres/init.sql

      - name: Alembic upgrade head
        run: uv run alembic -c packages/db/alembic.ini upgrade head

      - name: Alembic downgrade -1
        run: uv run alembic -c packages/db/alembic.ini downgrade -1

      - name: Alembic upgrade head (again)
        run: uv run alembic -c packages/db/alembic.ini upgrade head

      - name: Seed demo tenants
        run: uv run python -m db.seed

      - name: Start inference service
        run: |
          uv run uvicorn inference.main:app \
            --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/inference.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/inference.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/ready >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/inference.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/inference.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/inference.log"
          exit 1

      - name: Integration tests (RLS + auth)
        run: uv run pytest -q -m integration

      - name: Inference logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/inference.log" || true

  # Catches Dockerfile / compose regressions that unit tests never see (BUG-001,
  # BUG-003 env wiring, BUG-011 context). Build only — do not start the stack.
  container-build:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare env
        run: cp .env.example .env

      # Exercise compose interpolation (BUG-003) and prove REG-001's hardcoded
      # bypass=false cannot be overridden by .env — build-push-action alone only
      # checks a duplicated copy of the build-args in this workflow.
      - name: Compose config is resolvable and bypass stays off
        run: |
          set -euo pipefail
          # Poison the env: if compose ever reverts to ${DEV_AUTH_BYPASS:-false}
          # (or similar), resolved config would flip to true and this fails.
          {
            echo 'DEV_AUTH_BYPASS=true'
            echo 'NEXT_PUBLIC_DEV_AUTH=true'
          } >> .env
          docker compose --env-file .env -f infra/compose/docker-compose.yml config > /tmp/resolved.yml
          grep -q 'DEV_AUTH_BYPASS: "false"' /tmp/resolved.yml
          grep -q 'NEXT_PUBLIC_DEV_AUTH: "false"' /tmp/resolved.yml
          # api + worker both hardcode bypass off
          test "$(grep -c 'DEV_AUTH_BYPASS: "false"' /tmp/resolved.yml)" -eq 2
          # Restore clean .env for any later steps that might read it
          cp .env.example .env

      # api and worker share Dockerfile.api — one build, two tags.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.api
          load: true
          tags: |
            enterprise-rag-api:latest
            enterprise-rag-worker:latest
          cache-from: type=gha,scope=dockerfile-api
          cache-to: type=gha,mode=max,scope=dockerfile-api

      - name: Build inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.inference
          load: true
          tags: enterprise-rag-inference:latest
          cache-from: type=gha,scope=dockerfile-inference
          cache-to: type=gha,mode=max,scope=dockerfile-inference

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.web
          load: true
          tags: enterprise-rag-web:latest
          build-args: |
            NEXT_PUBLIC_API_BASE=http://localhost:8000
            NEXT_PUBLIC_DEV_AUTH=false
          cache-from: type=gha,scope=dockerfile-web
          cache-to: type=gha,mode=max,scope=dockerfile-web
