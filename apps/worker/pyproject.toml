[project]
name = "enterprise-rag-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "enterprise-rag-domain",
    "enterprise-rag-db",
    "enterprise-rag-observability",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "pydantic-settings>=2.7.0",
    "pypdf>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
